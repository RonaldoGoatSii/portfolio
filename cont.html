<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-container">
        <img src="ETIC_Algarve-Logo-Horizontal-Black-02@4x.png" alt="Logo ETIC">
    </header>

    <div class="page-container">
        <h1>Contactos</h1>
        <hr style="margin: 10px 0; border-color: darkcyan;">

        <div class="content-grid">
            <div>
                <h3>Mais informações</h3>
                <p style="margin-top: 10px;"> exemplo@hotmail.com</p>
                <p>+351 912 345 678</p>
                <p>Faro, Portugal</p>
            </div>

            <form action="#" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="text" placeholder="O seu Nome" style="padding: 10px; border-radius: 5px; border: none;">
                <input type="email" placeholder="O seu Email" style="padding: 10px; border-radius: 5px; border: none;">
                <textarea rows="4" placeholder="A sua Mensagem" style="padding: 10px; border-radius: 5px; border: none;"></textarea>
                <button type="submit" class="back-btn" style="border: none; cursor: pointer; text-align: center;">Enviar Mensagem</button>
            </form>
        </div>

        <a href="index.html" class="back-btn">← Voltar ao Menu</a>
    </div>

</body>
</html>
